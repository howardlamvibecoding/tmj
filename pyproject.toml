[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "tmj"
version = "0.1.0"
description = "Terminal Mahjong - A sleek 4-Player Hong Kong Mahjong TUI application built with Textual & Rich"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "TMJ Contributors"}
]
dependencies = [
    "textual>=0.40.0",
    "rich>=13.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
]

[project.scripts]
tmj = "tmj.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
